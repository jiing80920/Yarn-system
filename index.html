<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>用紗量管理</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#2f5d62">

<style>
:root{box-sizing:border-box;--bg:#f6f4ef;--card:#fff;--text:#222;--mute:#6b6b6b;--line:#ddd8cc;--accent:#2f5d62;--accent-t:#fff;--warn:#b3261e;--res:#eaf1f1;--abg:#fff3cd;--abd:#e0a100;--atx:#7a5200;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1a;--card:#222727;--text:#eee;--mute:#a0a8a8;--line:#394040;--accent:#7fb5ba;--accent-t:#102022;--warn:#ff8a80;--res:#1c3033;--abg:#3a3015;--abd:#c99a1c;--atx:#ffd98a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 20px;font-weight:700}
.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:18px 24px 48px}
.hide{display:none}
.brand{display:flex;align-items:center;gap:12px}
.syncb{font-size:.85rem;padding:5px 12px;border-radius:999px;color:var(--mute)}
.syncb.warnb{color:var(--atx)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal.hide{display:none}
.mbox{background:var(--card);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.card-h b{font-size:1.1rem;color:var(--accent)}
.hb{display:flex;gap:8px;align-items:center}
.stat{font-size:.82rem;color:var(--mute);margin-right:6px}
.stat.un{color:#b36b00;font-weight:700}
.sh2{font-size:.88rem;font-weight:700;margin:14px 0 6px}
.sh{font-size:.95rem;font-weight:700;color:var(--accent);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
.eq{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.eq>label{flex:1;min-width:140px;max-width:260px}
.eq>label.w{max-width:420px}
.op{padding-bottom:9px;color:var(--mute);font-weight:700}
label{display:block;font-size:.78rem;color:var(--mute)}
input,select{width:100%;min-width:0;font:inherit;font-size:.95rem;padding:8px 10px;margin-top:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
input.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;margin:10px auto 0;display:block;accent-color:var(--accent)}
.val{margin-top:2px;padding:8px 10px;border-radius:8px;background:var(--res);font-weight:700;font-size:1rem;text-align:right;font-variant-numeric:tabular-nums;min-height:38px}
.rw{display:grid;gap:8px;align-items:end;margin-bottom:8px}
.rw.k6{grid-template-columns:1fr 1fr 1fr 1fr 64px 40px}
.rw.m2{grid-template-columns:1fr 1fr 40px}
.rw.drow{grid-template-columns:1.1fr 1fr 1fr 1fr 84px 84px}
.rw.drow button{height:38px;margin-top:2px}
tr.gh td{background:var(--res);font-weight:700}
.rw.t6{grid-template-columns:1.2fr 1fr .8fr .9fr 1fr 40px}
.rw.y{grid-template-columns:1.4fr 1fr .8fr .8fr 40px}
.rw.p4{grid-template-columns:1fr 1.2fr 1fr 1fr 40px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 14px}
button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.x{color:var(--warn);padding:8px 0;height:38px}
.alert{background:var(--abg);border:1px solid var(--abd);color:var(--atx);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.alert .ln{color:inherit;font-weight:600;font-size:.86rem;margin-top:2px}
button.warnb{background:var(--abg);border-color:var(--abd);color:var(--atx);font-weight:700}
button.sm{padding:4px 10px;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
input.bad{border-color:var(--warn);outline:2px solid var(--warn)}
.rw.mrow{grid-template-columns:1.2fr 1.2fr 90px 90px}
.rw.mrow button{height:38px;margin-top:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--accent);color:var(--accent-t);padding:10px 22px;border-radius:999px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
button.add{color:var(--accent);border-style:dashed;width:100%;font-size:.92rem}
.chips{margin-bottom:16px;max-width:240px}
.chips select{font-size:1.15rem;font-weight:700;padding:10px 12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.76rem;color:var(--mute);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small,.ln{display:block;color:var(--mute);font-size:.74rem;line-height:1.45}
tfoot td,tr.ft td{font-weight:700;background:var(--res);border-bottom:none}
tr.cur td{background:var(--res)}
.neg{color:var(--warn)}
.empty{color:var(--mute);text-align:center;padding:16px 0}
.cmpi{font-size:.85rem;margin-bottom:8px;line-height:1.7}
.cmpi b{color:var(--accent)}
.cmp table{margin-bottom:12px}
.acts{display:flex;gap:8px}
.acts .p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.acts .w{margin-left:auto;color:var(--warn)}
/* ===== 手機版面（螢幕寬度 ≤ 720px 自動套用）===== */
html{-webkit-text-size-adjust:100%}
@media (max-width:720px){
  .top{padding:8px 12px;gap:8px}
  .brand{width:100%;justify-content:space-between}
  h1{font-size:1.05rem}
  .tabs{width:100%;gap:4px}
  .tabs button{flex:1;padding:9px 4px;font-size:.88rem}
  button.warnb{width:100%;padding:8px}
  main{padding:10px 10px 90px}
  .card{padding:12px;border-radius:12px}
  .card-h{align-items:flex-start}
  .card-h .hb{width:100%;flex-wrap:wrap}
  .card-h .hb .stat{flex:1 1 100%;margin:0}
  .card-h .hb button{flex:1;min-height:42px}
  input,select{font-size:16px;padding:10px;margin-top:3px}
  button{min-height:40px}
  /* 公式列：兩欄排列，運算符號隱藏 */
  .eq{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .eq>label,.eq>label.w{max-width:none;min-width:0}
  .eq>label.w{grid-column:1/-1}
  .op{display:none}
  /* 列：變成小卡，兩欄 */
  .rw{grid-template-columns:1fr 1fr!important;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
  .rw input,.rw select{background:var(--card)}
  .rw>button.x{grid-column:1/-1;height:40px}
  .rw.drow button,.rw.mrow button{height:44px;margin-top:0}
  input[type=checkbox]{margin:12px auto 0}
  .chips{max-width:none}
  .chips select{font-size:18px}
  /* 表格可左右滑動 */
  [data-o="plist"],[data-o="mlist"],[data-o="mused"],#cmpCur,#oBody{overflow-x:auto}
  table{font-size:.85rem}
  td,th{padding:7px 6px}
  th{white-space:nowrap}
  #cmpCur table,#oBody table,[data-o="plist"] table,[data-o="mlist"] table,[data-o="mused"] table{min-width:480px}
  #oBody table{min-width:760px}
  #sumArea .card>div>table{min-width:680px}
  #panel .card>div>table{min-width:820px}
  td:first-child{min-width:64px}
  .acts{flex-wrap:wrap}
  .acts button{flex:1 1 45%;min-height:44px}
  .acts .w{margin-left:0}
  #toast{bottom:18px;max-width:92vw;text-align:center}
}
@media print{.top,.acts{display:none}.pg{display:none!important}#pg2{display:block!important}body{background:#fff}}
</style>
</head>
<body>
<div class="top">
<div class="brand"><h1>用紗量管理</h1><button id="syncBtn" class="syncb" type="button">☁ 未連線</button></div>
<div class="tabs">
<button class="on" data-tab="0" type="button">託工用紗量</button>
<button data-tab="1" type="button">機台用紗設定</button>
<button data-tab="2" type="button">統整表格</button>
</div>
<button id="warnBadge" class="warnb hide" type="button" data-act="goWarn"></button>
</div>

<main>
<div class="pg" id="pg0">
<div id="subList"></div>
<div class="card"><div class="card-h"><b>二、託工單匯整</b><input id="oq" placeholder="搜尋布號" style="max-width:200px;margin:0"></div><div style="overflow-x:auto" id="oBody"></div></div>
</div>
<div class="pg hide" id="pg1"><div class="chips" id="chips"></div><div id="panel"></div></div>
<div class="pg hide" id="pg2">
<div id="sumArea"></div>
<div class="stat" id="bkInfo" style="margin:0 0 8px"></div>
<div class="acts"><button class="p" id="copy" type="button">複製統整</button><button id="print" type="button">列印</button><button id="export" type="button">匯出備份</button><button id="import" type="button">匯入還原</button><button class="w" id="reset" type="button">全部清除</button></div>
<input type="file" id="impFile" accept=".json,application/json" class="hide">
</div>
</main>

<div id="syncModal" class="modal hide"><div class="mbox">
<div class="card-h"><b>雲端同步（GitHub）</b></div>
<div id="syMsg" class="cmpi" style="min-height:1.5em"></div>
<div class="eq" style="grid-template-columns:1fr">
<label class="w">GitHub 帳號<input id="syOwner" autocapitalize="off" autocomplete="off" placeholder="例 jiing80920"></label>
<label class="w">資料庫名稱（必須是 Private）<input id="syRepo" autocapitalize="off" autocomplete="off" placeholder="例 yarn-data"></label>
<label class="w">資料檔名稱<input id="syPath" autocapitalize="off" autocomplete="off" placeholder="yarn-data.json"></label>
<label class="w">同步密碼<input id="syPassword" type="password" autocomplete="off" placeholder="輸入你設定在 Cloudflare 的 SYNC_PASSWORD"></label>
</div>
<div class="acts" style="flex-wrap:wrap;margin-top:10px">
<button class="p" id="syConnect" type="button">連線並同步</button>
<button id="syNow" type="button">立即同步</button>
<button id="syOff" type="button" style="color:var(--warn)">中斷連線</button>
<button id="syClose" type="button">關閉</button>
</div></div></div>
<div id="cfModal" class="modal hide"><div class="mbox">
<div class="card-h"><b>兩邊資料不一致</b></div>
<div id="cfText" class="cmpi" style="line-height:1.9"></div>
<div class="acts" style="flex-wrap:wrap;margin-top:10px">
<button class="p" id="cfCloud" type="button">使用雲端版本</button>
<button id="cfLocal" type="button">使用這台的版本</button>
<button id="cfLater" type="button">稍後再決定</button>
</div></div></div>
<div id="toast"></div>
<datalist id="dlName"></datalist>
<datalist id="dlBatch"></datalist>

<script>
const $=id=>document.getElementById(id);
const GROUPS=[[1,2],[2,2],[3,2],[5,5],[6,8]];
const IDS=[];GROUPS.forEach(([g,n])=>{for(let i=1;i<=n;i++)IDS.push(g+'-'+i)});
const KEY='yarn-system-v3';
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const uid=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const coilB=()=>({u:uid(),d:today(),no:'',l:'',m:'',ok:false});
const yarnB=()=>({n:'',b:'',wy:''});
const pullB=(n,b)=>({d:today(),n:n||'',b:b||'',q:''});
const subB=()=>({id:null,no:'',qty:'',shr:'',yarns:[yarnB()],coils:[coilB()]});
const madeB=()=>({d:today(),q:''});
const draftB=()=>({d:today(),n:'',b:'',q:''});
const stockB=(n,b)=>({d:today(),n:n||'',b:b||'',q:''});
const machB=()=>({no:'',coilNo:'',src:'',len:'',shr:'',rpm:'',pit:'',start:'',yarns:[yarnB()],pulls:[],mades:[],draft:draftB(),pdraft:draftB(),stocks:[stockB()],sig:'',savedAt:0});
let st={cur:subB(),orders:[],mach:{},sel:'1-1'};

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&s.mach){st=s;if(!st.cur&&Array.isArray(st.sub)&&st.sub.length)st.cur=st.sub[0]}
  }catch(e){}
  if(!st.cur)st.cur=subB();
  if(!Array.isArray(st.orders))st.orders=[];
  delete st.sub;
  const fixO=o=>{
    if(o.id===undefined)o.id=null;
    ['no','qty','shr'].forEach(k=>{if(o[k]===undefined)o[k]=''});
    if(!Array.isArray(o.yarns)||!o.yarns.length)o.yarns=[{n:'',b:'',wy:o.wy||''}];
    delete o.wy;
    if(!Array.isArray(o.coils)||!o.coils.length)o.coils=[coilB()];
    o.coils.forEach(c=>{if(c.m===undefined)c.m='';if(c.ok===undefined)c.ok=false;if(c.no===undefined)c.no='';if(!c.u)c.u=uid()});
  };
  fixO(st.cur);st.orders.forEach(fixO);
  IDS.forEach(id=>{
    const m=st.mach[id]=st.mach[id]||machB();
    if(!Array.isArray(m.yarns)||!m.yarns.length)m.yarns=[yarnB()];
    if(!Array.isArray(m.pulls))m.pulls=[];
    ['no','coilNo','src','len','shr','rpm','pit','start'].forEach(k=>{if(m[k]===undefined)m[k]=''});
    if(!Array.isArray(m.mades))m.mades=[];
    m.mades=m.mades.filter(x=>x&&num(x.q)>0);
    m.mades.forEach(x=>{x.n='';x.b=''});
    if(!m.draft)m.draft=draftB();if(!m.pdraft)m.pdraft=draftB();
    [m.draft,m.pdraft].forEach(x=>{if(x.n===undefined)x.n='';if(x.b===undefined)x.b=''});
    if(m.sig===undefined)m.sig='';if(m.savedAt===undefined)m.savedAt=0;
    if(!Array.isArray(m.stocks)||!m.stocks.length)m.stocks=[stockB()];
    m.pulls.forEach(p=>{if(p.n===undefined){const y=m.yarns[parseInt(p.y)||0]||{};p.n=y.n||'';p.b=y.b||''}});
    m.pulls=m.pulls.filter(x=>x&&num(x.q)>0);
  });
  const U=o=>{['no','n','b'].forEach(k=>{if(typeof o[k]==='string')o[k]=o[k].toUpperCase()})};
  [st.cur].concat(st.orders).forEach(o=>{U(o);o.yarns.forEach(U)});
  IDS.forEach(id=>{const m=st.mach[id];U(m);m.yarns.forEach(U);m.pulls.forEach(U);m.stocks.forEach(U);m.mades.forEach(U);U(m.draft);U(m.pdraft)});
  if(!IDS.includes(st.sel))st.sel=IDS[0];
}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const save=()=>{st.updatedAt=Date.now();persist();syncSoon()};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r4=n=>Math.round(n*10000)/10000;
const fmt=n=>(n===null||n===undefined)?'—':r4(n).toLocaleString('zh-TW',{maximumFractionDigits:4});
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const sum=a=>a.reduce((x,y)=>x+y,0);
const norm=s=>s.trim().replace(/\s+/g,' ').toUpperCase();
const kk=(n,b)=>norm(n)+'\u0000'+norm(b);

/* ---------- 日期：可直接輸入，民國年自動換算西元年 ---------- */
function parseDate(s){
  s=String(s||'').trim();if(!s)return null;
  s=s.replace(/[年月\-.\s]+/g,'/').replace(/日/g,'').replace(/\/+/g,'/').replace(/^\/|\/$/g,'');
  let y,m,d;const now=new Date();
  if(s.includes('/')){
    const q=s.split('/');
    if(q.length===3){y=q[0];m=q[1];d=q[2]}
    else if(q.length===2){y=String(now.getFullYear());m=q[0];d=q[1]}
    else return null;
  }else{
    if(!/^\d+$/.test(s))return null;
    if(s.length===8){y=s.slice(0,4);m=s.slice(4,6);d=s.slice(6)}
    else if(s.length===7){y=s.slice(0,3);m=s.slice(3,5);d=s.slice(5)}
    else if(s.length===6){y=s.slice(0,2);m=s.slice(2,4);d=s.slice(4)}
    else if(s.length===4){y=String(now.getFullYear());m=s.slice(0,2);d=s.slice(2)}
    else return null;
  }
  if(!/^\d+$/.test(y+m+d))return null;
  let yy=parseInt(y,10);
  if(y.length<=3)yy+=1911;else if(y.length!==4)return null;
  const mm=parseInt(m,10),dd=parseInt(d,10),t=new Date(yy,mm-1,dd);
  if(t.getFullYear()!==yy||t.getMonth()!==mm-1||t.getDate()!==dd)return null;
  return yy+'-'+p2(mm)+'-'+p2(dd);
}
function parseDT(s){
  s=String(s||'').trim();if(!s)return '';
  let dp=s,hh=8,mi=0;
  const m=s.match(/^(.*?)[\sT]+(\d{1,2})(?::?(\d{2}))?$/);
  if(m&&m[1]){dp=m[1];hh=+m[2];mi=m[3]?+m[3]:0}
  if(hh>23||mi>59)return null;
  const d=parseDate(dp);
  return d?d+'T'+p2(hh)+':'+p2(mi):null;
}
const fmtD=v=>v?esc(String(v).replace(/-/g,'/')):'';
const fmtDT=v=>v?esc(String(v).replace(/-/g,'/').replace('T',' ')):'';

/* ---------- 元件 ---------- */
const A=(sc,i,l,j)=>'data-sc="'+sc+'" data-i="'+i+'"'+(l?' data-l="'+l+'" data-j="'+j+'"':'');
function inp(a,f,label,v,o){
  o=o||{};
  const dv=o.date?fmtD(v):o.dt?fmtDT(v):esc(v);
  return '<label'+(o.w?' class="w"':'')+'>'+label+'<input '+a+' data-f="'+f+'"'+(o.n?' class="num" inputmode="decimal" data-num="1"':'')+
    (o.up?' data-up="1"':'')+(o.date?' data-date="1" inputmode="numeric" placeholder="例 115/11/17"':'')+(o.dt?' data-date="2" placeholder="例 115/11/17 08:00"':'')+
    (o.t?' type="'+o.t+'"':'')+(o.list?' list="'+o.list+'"':'')+' value="'+dv+'"></label>';
}
const out=(label,name,unit)=>'<label>'+label+'<div class="val"><span data-o="'+name+'">—</span>'+(unit?' '+unit:'')+'</div></label>';
const xbtn=(act,attrs)=>'<button class="x" type="button" data-act="'+act+'" '+attrs+' aria-label="刪除">✕</button>';
const SEP='<option disabled value="">──────</option>';
const machOpts=(v,mark)=>GROUPS.map(([g])=>IDS.filter(x=>x.startsWith(g+'-')).map(id=>'<option value="'+id+'"'+(v===id?' selected':'')+'>'+id+(mark?mmark(id):'')+'</option>').join('')).join(SEP);
const machSel=(a,f,label,v)=>'<label>'+label+'<select '+a+' data-f="'+f+'"><option value="">—</option>'+machOpts(v,false)+'</select></label>';
const chk=(a,f,label,v,dis)=>'<label style="text-align:center">'+label+'<input type="checkbox" '+a+' data-f="'+f+'"'+(v?' checked':'')+(dis?' disabled':'')+'></label>';

/* ---------- 通用表格 ---------- */
function cellH(c){
  if(c&&typeof c==='object'&&'sm' in c)return '<td>'+esc(c.t)+'<small>'+esc(c.sm)+'</small></td>';
  if(c&&typeof c==='object'&&'pct' in c)return '<td class="n neg">'+(Math.round(c.pct*10)/10)+'%</td>';
  if(c&&typeof c==='object'){const red=c.red!==undefined?c.red:(c.v!==null&&r4(c.v)<0);return '<td class="n'+(red?' neg':'')+'">'+fmt(c.v)+'</td>'}

/* ---------- 計算 ---------- */
function ocalc(o){
  const qty=num(o.qty),shr=num(o.shr);
  const ct=sum(o.coils.map(c=>num(c.l)||0));
  const est=ct>0?ct*(1-(shr||0)/100):null;
  const ys=o.yarns.map(y=>{const wy=num(y.wy);return {y,wy,need:(qty!==null&&wy!==null)?qty*wy:null,estNeed:(est!==null&&wy!==null)?est*wy:null}});
  return {qty,shr,ct,est,ys,need:sum(ys.map(x=>x.need||0)),estNeed:sum(ys.map(x=>x.estNeed||0))};
}
function mcalc(m){
  const len=num(m.len),shr=num(m.shr);
  const qty=len!==null?len*(1-(shr||0)/100):null;
  const made=sum(m.mades.map(x=>num(x.q)||0));
  const map=new Map();
  const get=(n,b)=>{const k=kk(n,b);let e=map.get(k);if(!e){e={n:n.trim(),b:b.trim(),need:0,pull:0,used:0,stock:0};map.set(k,e)}return e};
  const rowNeed=m.yarns.map(y=>{
    const wy=num(y.wy),need=(qty!==null&&wy!==null)?qty*wy:0,e=get(y.n,y.b);
    e.need+=need;e.used+=wy!==null?made*wy:0;
    return {need,has:wy!==null};
  });
  const one=m.yarns.length===1?m.yarns[0]:null;
  const put=(r,f)=>{
    const q=num(r.q)||0;if(!q)return;
    const e=(!r.n.trim()&&!r.b.trim()&&one)?get(one.n,one.b):get(r.n,r.b);
    e[f]+=q;
  };
  m.pulls.forEach(r=>put(r,'pull'));m.stocks.forEach(r=>put(r,'stock'));
  const ys=[...map.values()];
  ys.forEach(e=>{e.made=made});
  const T=f=>sum(ys.map(x=>x[f]));
  return {qty,rowNeed,ys,made,need:T('need'),pull:T('pull'),used:T('used'),stock:T('stock')};
}
function ystat(x){
  const rem=x.pull>0?x.pull-x.need:null;
  const left=x.used>0?x.pull-x.used:null;                       // 廠內應餘紗 = 領用 − 已用
  const diff=(x.stock>0&&left!==null)?x.stock-left:null;        // 比對差異 = 庫存 − 廠內應餘紗
  const act=(x.made>0&&x.pull>0)?(x.pull-x.stock)/x.made:null;      // 實際用紗量 = (領用 − 庫存) ÷ 已生產碼數
  return {rem,left,diff,act};
}
const WARN=0.75;   // 已用量達領用量的 75% 即提醒再領紗
const warnFrom=c=>c.ys.filter(x=>x.used>0&&(x.pull<=0||x.used/x.pull>=WARN)).map(x=>({n:x.n,b:x.b,pull:x.pull,used:x.used,ratio:x.pull>0?x.used/x.pull:null}));
const warnMsg=w=>w.ratio===null?'尚未領紗，請盡快領紗':(w.ratio>=1?'領用量已用完，請立即領紗':'已用 '+(Math.round(w.ratio*1000)/10)+'%，需再領紗');
const nc=(v,red)=>'<td class="n'+(red?' neg':'')+'">'+fmt(v)+'</td>';
function statRow(name,x){
  const t=ystat(x);
  return '<tr><td>'+esc(name)+'</td>'+nc(x.need||null)+nc(x.pull||null)+nc(t.rem,t.rem!==null&&r4(t.rem)<0)+nc(x.used||null)+nc(t.left,t.left!==null&&r4(t.left)<0)+nc(x.stock||null)+nc(t.diff,t.diff!==null&&r4(t.diff)!==0)+nc(t.act)+(()=>{const r=(x.pull>0&&x.used>0)?x.used/x.pull:null;return '<td class="n'+(r!==null&&r>=WARN?' neg':'')+'">'+(r===null?'—':(Math.round(r*1000)/10)+'%')+'</td>'})()+'</tr>';
}

/* 預估完工：成品數量 ÷ (轉速×40÷緯密) = 天數；工作時間為週一 08:00 ～ 週日 08:00（週日 08:00 ～ 週一 08:00 休息） */
const WD=['日','一','二','三','四','五','六'];
const dtFmt=d=>d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+'（週'+WD[d.getDay()]+'）'+p2(d.getHours())+':'+p2(d.getMinutes());
function addRun(t0,ms){
  let t=new Date(t0),rem=ms;
  for(let i=0;i<1000;i++){
    let d=t.getDay(),h=t.getHours();
    if((d===0&&h>=8)||(d===1&&h<8)){
      const n=new Date(t);n.setHours(8,0,0,0);
      if(d===0)n.setDate(n.getDate()+1);
      t=n;
    }
    d=t.getDay();
    const end=new Date(t);end.setHours(8,0,0,0);end.setDate(end.getDate()+((7-d)%7));
    const avail=end.getTime()-t.getTime();
    if(rem<=avail)return new Date(t.getTime()+rem);
    rem-=avail;t=new Date(end.getTime());
  }
  return null;
}
function finishCalc(m,qty){
  const rpm=num(m.rpm),pit=num(m.pit);
  if(qty===null||qty<=0||rpm===null||rpm<=0||pit===null||pit<=0||!m.start)return null;
  const t0=new Date(m.start);if(isNaN(t0.getTime()))return null;
  const daily=rpm*40/pit,days=qty/daily;
  return {daily,days,end:addRun(t0,days*86400000)};
}

    });

  const pre=[...new Set(o.coils.filter(x=>x.m).map(x=>x.m))];
  const sched=[...new Set(o.coils.filter(x=>x.m&&x.ok).map(x=>x.m))];

/* ---------- 事件 ---------- */
function targetObj(t){
  let o=t.dataset.sc==='sub'?st.cur:st.mach[t.dataset.i];
  if(t.dataset.l==='draft')return o.draft;
  if(t.dataset.l==='pdraft')return o.pdraft;
  if(t.dataset.l)o=o[t.dataset.l][+t.dataset.j];
  return o;
}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.f)return;
  if(t.dataset.date){
    targetObj(t)[t.dataset.f]=(t.dataset.date==='2'?parseDT(t.value):parseDate(t.value))||'';
    if(t.classList.contains('bad')&&(t.dataset.date==='2'?parseDT(t.value):parseDate(t.value)))t.classList.remove('bad');
    save();update();return;
  }
  if(t.dataset.num){
    const v=t.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');
    if(v!==t.value)t.value=v;
  }
  if(t.dataset.up&&!e.isComposing){
    const u=t.value.toUpperCase();
    if(u!==t.value){const a0=t.selectionStart,a1=t.selectionEnd;t.value=u;try{t.setSelectionRange(a0,a1)}catch(_){}}
  }
  const o=targetObj(t);
  o[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.sc==='sub'&&t.dataset.f==='m'){
    const row=t.closest('.rw'),cb=row&&row.querySelector('[data-f="ok"]');
    if(cb){cb.disabled=!t.value;if(!t.value){cb.checked=false;o.ok=false}}
  }
  save();update();
});
function batchesFor(n){
  const k=norm(n||''),mp=new Map();
  const add=x=>{if(!x||!x.b||!String(x.b).trim())return;if(k&&norm(x.n||'')!==k)return;mp.set(norm(x.b),String(x.b).trim())};
  st.cur.yarns.forEach(add);st.orders.forEach(o=>o.yarns.forEach(add));
  IDS.forEach(id=>{const m=st.mach[id];[m.yarns,m.pulls,m.mades,m.stocks].forEach(a=>a.forEach(add));add(m.draft);add(m.pdraft)});
  return [...mp.values()].sort((a,b)=>a.localeCompare(b,'zh-TW',{numeric:true}));
}
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('list')==='dlBatch'){
    const row=t.closest('.rw'),ni=row&&row.querySelector('[data-f="n"]');
    $('dlBatch').innerHTML=batchesFor(ni?ni.value:'').map(v=>'<option value="'+esc(v)+'">').join('');
  }
  if(t.tagName==='INPUT'&&t.type!=='checkbox'&&((t.dataset&&t.dataset.f)||t.id==='oq'))setTimeout(()=>{try{t.select()}catch(_){}},0);
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.date)return;
  const two=t.dataset.date==='2',v=t.value.trim();
  if(!v){t.classList.remove('bad');return}
  const iso=two?parseDT(v):parseDate(v);
  if(iso){t.value=two?fmtDT(iso):fmtD(iso);t.classList.remove('bad');targetObj(t)[t.dataset.f]=iso;save();update()}
  else t.classList.add('bad');
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&(t.dataset.l==='draft'||t.dataset.l==='pdraft')&&t.dataset.f==='q'){e.preventDefault();addRec(t.dataset.l==='draft'?'made':'pull')}

document.addEventListener('compositionend',e=>{if(e.target.dataset&&e.target.dataset.up)e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('change',e=>{
  if(e.target.id==='machSel'){st.sel=e.target.value;persist();renderMach();return}

function addRec(kind){
  const M=st.mach[st.sel],made=kind==='made';
  const dr=made?M.draft:M.pdraft,list=made?M.mades:M.pulls,q=num(dr.q);
  if(!(q>0)){alert(made?'請輸入已產數量 (碼)':'請輸入領用數量 (kg)');return}
  list.push({d:dr.d||today(),n:made?'':dr.n,b:made?'':dr.b,q:String(q)});
  dr.q='';save();renderMach();
  setTimeout(()=>{const e=document.querySelector('#panel [data-l="'+(made?'draft':'pdraft')+'"][data-f="q"]');if(e)e.focus()},0);

    case 'addYarn':M.yarns.push(yarnB());break;

    case 'clrMade':M.draft=draftB();save();renderMach();return;
    case 'rmMade':M.mades.splice(j,1);break;
    case 'saveMach':M.sig=sigOf(M);M.savedAt=Date.now();save();update();toast('已儲存 機台 #'+id);return;
    case 'addStock':M.stocks.push(stockB(M.yarns[0].n,M.yarns[0].b));break;
    case 'rmStock':if(M.stocks.length>1)M.stocks.splice(j,1);else M.stocks[0]=stockB();break;
    default:return;
  }
  save();renderMach();
});

$('oq').addEventListener('input',renderOrders);
/* ---------- 雲端同步（Cloudflare Worker 中介；GitHub Token 不進入瀏覽器）---------- */
const SYNC_KEY='yarn-sync-v1';
const WORKER_URL='https://yarn-sync.sy7g7rpw6f.workers.dev';
const PASSWORD_KEY='yarn-sync-password';
let sc=null;try{sc=JSON.parse(localStorage.getItem(SYNC_KEY)||'null')}catch(e){}
let syncPassword='';try{syncPassword=sessionStorage.getItem(PASSWORD_KEY)||''}catch(e){}
const scSave=()=>{
  try{
    if(sc){
      delete sc.token;                 // 舊版曾把 GitHub Token 存在 localStorage，移除它
      localStorage.setItem(SYNC_KEY,JSON.stringify(sc));
    }else localStorage.removeItem(SYNC_KEY);
  }catch(e){}
};
if(sc)scSave();
const sy={busy:false,err:'',last:0,timer:null,again:0,paused:false};
const devName=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'手機':'電腦';
function b64enc(str){const by=new TextEncoder().encode(str);let bin='';by.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
const encPath=q=>q.split('/').map(encodeURIComponent).join('/');
const repoUrl=()=>'/repos/'+encodeURIComponent(sc.owner)+'/'+encodeURIComponent(sc.repo);
const fileUrl=()=>repoUrl()+'/contents/'+encPath(sc.path);
async function api(path,opt){
  opt=opt||{};
  const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+syncPassword,'X-GitHub-Api-Version':'2022-11-28'};
  if(opt.body)h['Content-Type']='application/json';
  const r=await fetch(WORKER_URL+path,{method:opt.method||'GET',cache:'no-store',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,json:j};
}
function apiErr(r){
  const m={401:'同步密碼錯誤或尚未輸入',403:'沒有權限，或 GitHub 已達使用上限',404:'找不到 yarn-data 或資料檔',405:'Worker 不允許這個操作'};
  return {msg:m[r.status]||(r.json&&r.json.error)||('同步服務回應錯誤（'+r.status+'）')};
}
async function remoteGet(){
  const r=await api(fileUrl()+'?_='+Date.now());
  if(r.status===404)return {none:true};
  if(!r.ok)throw apiErr(r);
  if(!r.json||!r.json.content)throw {msg:'資料檔太大或格式不正確，無法同步'};
  let doc;try{doc=JSON.parse(b64dec(r.json.content))}catch(e){throw {msg:'雲端資料檔不是有效的備份格式'}}
  return {sha:r.json.sha,doc};
}
async function remotePut(doc,sha){
  const body={message:'sync '+new Date().toISOString(),content:b64enc(JSON.stringify(doc))};
  if(sha)body.sha=sha;
  const r=await api(fileUrl(),{method:'PUT',body});
  if(r.status===409||r.status===422)return {conflict:true};
  if(!r.ok)throw apiErr(r);
  return {sha:r.json.content.sha};
}
const hasAnyData=()=>st.orders.length>0||IDS.some(id=>hasData(st.mach[id]))||orderStatus()[1]===1;

function showSync(){
  const b=$('syncBtn');if(!b)return;
  let t,w=false;
  if(!sc)t='☁ 未連線';
  else if(sy.busy)t='☁ 同步中…';
  else if(sy.paused){t='⚠ 需選擇版本';w=true}
  else if(sy.err){t='⚠ 同步失敗';w=true}
  else if((st.updatedAt||0)>(sc.baseAt||0))t='☁ 待同步…';
  else t='☁ 已同步 '+hm(sy.last||Date.now());
  b.textContent=t;b.className='syncb'+(w?' warnb':'');
}
function syncSoon(){
  if(!sc)return;
  showSync();
  if(sy.paused)return;
  clearTimeout(sy.timer);sy.timer=setTimeout(()=>syncNow(false),2000);
}
function askConflict(cloudAt,cloudDev,localAt){
  return new Promise(res=>{
    const f=t=>t?tsFmt(t)+' '+hm(t):'—';
    $('cfText').innerHTML='雲端和這台裝置的資料都有變動，請選擇要保留哪一份：<br><b>雲端</b>　'+f(cloudAt)+(cloudDev?'（'+esc(cloudDev)+'）':'')+'<br><b>這台</b>　'+f(localAt)+'<br>沒選的那一份會被取代。';
    const m=$('cfModal');m.classList.remove('hide');
    const done=v=>{m.classList.add('hide');res(v)};
    $('cfCloud').onclick=()=>done('cloud');$('cfLocal').onclick=()=>done('local');$('cfLater').onclick=()=>done('later');
  });
}
function applyRemote(doc,sha){
  const d=doc.data;
  if(!d||typeof d!=='object'||!d.mach)throw {msg:'雲端資料格式不正確'};
  const keep=st.sel;
  st=d;st.sel=keep;st.updatedAt=doc.updatedAt||0;
  persist();load();persist();
  sc.sha=sha||sc.sha;sc.baseAt=doc.updatedAt||0;sc.synced=true;scSave();sy.last=Date.now();
  renderSub();renderMach();showBackup();
}
async function pushLocal(sha){
  if(!st.updatedAt){st.updatedAt=Date.now();persist()}
  const snap=st.updatedAt;
  const r=await remotePut({app:'yarn-system',version:3,updatedAt:snap,device:devName,data:st},sha);
  if(r.conflict)return 'conflict';
  sc.sha=r.sha;sc.baseAt=snap;sc.synced=true;scSave();sy.last=Date.now();
  return 'ok';
}
async function syncNow(manual){
  if(!sc)return;
  if(!syncPassword){sy.err='請先輸入同步密碼';showSync();if(manual)openSync();return}
  if(sy.busy){sy.again++;return}
  if(sy.paused&&!manual)return;
  sy.busy=true;sy.err='';sy.paused=false;showSync();
  try{
    for(let round=0;round<4;round++){
      const rm=await remoteGet();
      const localAt=st.updatedAt||0,base=sc.baseAt||0,dirty=localAt>base;
      if(rm.none){
        if(await pushLocal(null)==='conflict')continue;
      }else{
        const rAt=rm.doc.updatedAt||0;sc.sha=rm.sha;
        if(sc.synced&&rAt===base){
          if(dirty){if(await pushLocal(rm.sha)==='conflict')continue}
          else{sy.last=Date.now()}
        }else{
          const first=!sc.synced;
          if((!first&&!dirty)||(first&&!hasAnyData())){applyRemote(rm.doc,rm.sha)}
          else{
            const ch=await askConflict(rAt,rm.doc.device,localAt);
            if(ch==='cloud')applyRemote(rm.doc,rm.sha);
            else if(ch==='local'){if(await pushLocal(rm.sha)==='conflict')continue}
            else{sy.paused=true}
          }
        }
      }
      if(sy.paused)break;
      if((st.updatedAt||0)>(sc.baseAt||0)&&round<3)continue;
      break;
    }
  }catch(e){sy.err=(e&&e.msg)?e.msg:'無法連線（可能離線），稍後會自動重試'}
  sy.busy=false;showSync();
}
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!a.closest('#syncModal')};
setInterval(()=>{if(sc&&syncPassword&&!sy.busy&&!sy.paused&&document.visibilityState==='visible'&&!typing())syncNow(false)},60000);
document.addEventListener('visibilitychange',()=>{
  if(!sc||!syncPassword)return;
  if(document.visibilityState==='hidden'){if((st.updatedAt||0)>(sc.baseAt||0)){clearTimeout(sy.timer);syncNow(false)}}
  else if(!typing())syncNow(false);
});
window.addEventListener('online',()=>{if(sc&&syncPassword)syncNow(false)});

const syMsg=(t,bad)=>{const e=$('syMsg');e.textContent=t;e.style.color=bad?'var(--warn)':''};
function openSync(){
  $('syOwner').value=sc?sc.owner:'jiing80920';$('syRepo').value=sc?sc.repo:'yarn-data';$('syPath').value=sc?sc.path:'yarn-data.json';$('syPassword').value=syncPassword;
  syMsg(sc?(sy.err?('目前狀態：'+sy.err):(sy.paused?'目前狀態：等待選擇保留哪一份資料，按「立即同步」繼續':'已設定同步')):'尚未連線',!!(sc&&(sy.err)));
  $('syncModal').classList.remove('hide');
}
$('syncBtn').onclick=openSync;
$('syClose').onclick=()=>$('syncModal').classList.add('hide');
$('syNow').onclick=async()=>{
  if(!sc){syMsg('請先填寫並按「連線並同步」',true);return}
  syncPassword=$('syPassword').value.trim();
  try{sessionStorage.setItem(PASSWORD_KEY,syncPassword)}catch(e){}
  syMsg('同步中…');await syncNow(true);
  syMsg(sy.err?('同步失敗：'+sy.err):(sy.paused?'已暫停，尚未選擇保留哪一份資料':'同步完成 '+hm(sy.last)),!!sy.err);
};
$('syOff').onclick=()=>{
  if(!sc)return;
  if(!confirm('中斷連線後，這台裝置的資料會保留，但不再與雲端同步。確定要中斷嗎？'))return;
  sc=null;scSave();syncPassword='';try{sessionStorage.removeItem(PASSWORD_KEY)}catch(e){}
  sy.err='';sy.paused=false;clearTimeout(sy.timer);showSync();syMsg('已中斷連線');
};
$('syConnect').onclick=async()=>{
  const o=$('syOwner').value.trim(),r=$('syRepo').value.trim(),q=$('syPath').value.trim()||'yarn-data.json';
  const pw=$('syPassword').value.trim();
  if(!o||!r||!pw){syMsg('請填寫 GitHub 帳號、資料庫名稱與同步密碼',true);return}
  if(o!=='jiing80920'||r!=='yarn-data'||q!=='yarn-data.json'){syMsg('目前同步服務只允許 jiing80920/yarn-data/yarn-data.json',true);return}
  const prev=sc;
  sc={owner:o,repo:r,path:q,sha:'',baseAt:0,synced:false};
  if(prev&&prev.owner===o&&prev.repo===r&&prev.path===q){sc.sha=prev.sha;sc.baseAt=prev.baseAt;sc.synced=prev.synced}
  syncPassword=pw;try{sessionStorage.setItem(PASSWORD_KEY,pw)}catch(e){}
  syMsg('測試連線中…');
  try{
    const rr=await api(repoUrl());
    if(!rr.ok){sc=prev;syMsg(apiErr(rr).msg,true);return}
    if(rr.json&&rr.json.private===false){sc=prev;syMsg('這個資料庫是公開的，請確認 GitHub Repository 為 Private。',true);return}
  }catch(e){sc=prev;syMsg('無法連線到同步服務，請確認 Worker 已部署及同步密碼正確',true);return}
  scSave();sy.paused=false;sy.err='';showSync();
  $('syncModal').classList.add('hide');
  syncNow(true);
};



load();renderSub();renderMach();showBackup();
showSync();if(sc){if(syncPassword)syncNow(false);else openSync();}
</script>
